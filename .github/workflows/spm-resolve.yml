name: SPM resolve time

on:
  push:

env:
  ARCHIVE_PATH: ${{ github.workspace }}/build/SPMSample.xcarchive

jobs:
  resolve:
    name: Resolve and build
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain in use
        run: xcodebuild -version

      - name: Resolve dependencies
        run: |
          set -o pipefail
          start=$(date +%s)
          xcodebuild -resolvePackageDependencies \
            -project Examples/SPMSample/SPMSample.xcodeproj \
            -scheme SPMSample \
            -clonedSourcePackagesDirPath "${{ runner.temp }}/spm" \
            2>&1 | tee resolve.log
          echo "RESOLVE_SECS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Archive for device (unsigned)
        run: |
          set -o pipefail
          start=$(date +%s)
          xcodebuild archive \
            -project Examples/SPMSample/SPMSample.xcodeproj \
            -scheme SPMSample \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -clonedSourcePackagesDirPath "${{ runner.temp }}/spm" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee archive.log
          echo "ARCHIVE_SECS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Package unsigned .ipa
        run: |
          cd "$(dirname "$ARCHIVE_PATH")"
          rm -rf Payload
          mkdir Payload
          cp -R "$ARCHIVE_PATH/Products/Applications/SPMSample.app" Payload/
          IPA="SPMSample-unsigned.ipa"
          zip -qry "$IPA" Payload
          echo "IPA_NAME=$IPA" >> "$GITHUB_ENV"
          echo "IPA_SIZE=$(du -m "$IPA" | cut -f1) MB" >> "$GITHUB_ENV"
          unzip -l "$IPA" | grep -q 'Payload/SPMSample.app/SPMSample' \
            || { echo "::error::ipa does not contain the app binary"; exit 1; }

      - name: Summary
        if: always()
        run: |
          {
            echo "## SPM resolve and build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| resolve time | \`${RESOLVE_SECS:-?}s\` |"
            echo "| archive time | \`${ARCHIVE_SECS:-?}s\` |"
            echo "| artifact | \`${IPA_NAME:-not produced}\` |"
            echo "| ipa size | \`${IPA_SIZE:-?}\` |"
            echo ""
            echo "Build is **unsigned** and is not directly installable on a device."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload .ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SPMSample-unsigned-ipa
          path: build/*.ipa
          if-no-files-found: error

      - name: Upload .xcarchive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SPMSample-xcarchive
          path: build/SPMSample.xcarchive
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            resolve.log
            archive.log
          if-no-files-found: warn
